{% extends 'base.html' %}

{% block title %}Изтрий изпълнител | LocalStage{% endblock %}

{% block content %}
<h1>Изтрий изпълнител</h1>

<p class="mt-3">
    Сигурен ли си, че искаш да изтриеш
    <strong>{{ performer.name }}</strong>?
</p>

<form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Изтрий</button>
    <a href="{% url 'performer-details' performer.pk %}" class="btn btn-outline-secondary">Отказ</a>
</form>
{% endblock %}
