{% extends 'base.html' %}

{% block title %}Изтрийте изпълнител | LocalStage{% endblock %}

{% block content %}
<h1>Изтрийте изпълнител</h1>

<p class="mt-3">
    Сигурни ли сте, че искате да изтриете
    <strong>{{ performer.name }}</strong>?
</p>

<form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Изтрийте</button>
    <a href="{% url 'performer-details' performer.pk %}" class="btn btn-outline-secondary">Отказ</a>
</form>
{% endblock %}
