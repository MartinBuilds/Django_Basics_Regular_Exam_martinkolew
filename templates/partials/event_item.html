<li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <a href="{% url 'event-details' event.pk %}">
            <strong>{{ event.title }}</strong>
        </a>
        — {{ event.start_datetime|date:"d.m.Y H:i" }}
        @ {{ event.venue }}
    </div>
    {% if event.status == 'upcoming' %}
        <span class="badge text-bg-success">{{ event.status_label }}</span>
    {% elif event.status == 'ongoing' %}
        <span class="badge text-bg-warning text-dark">{{ event.status_label }}</span>
    {% else %}
        <span class="badge text-bg-secondary">{{ event.status_label }}</span>
    {% endif %}
</li>
