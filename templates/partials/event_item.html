<li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <a href="{% url 'event-details' event.pk %}">
            <strong>{{ event.title }}</strong>
        </a>
        — {{ event.start_datetime|date:"d.m.Y H:i" }}
        @ {{ event.venue }}
    </div>
    {% if event.is_upcoming %}
        <span class="badge text-bg-success">Предстоящо</span>
    {% else %}
        <span class="badge text-bg-secondary">Минило</span>
    {% endif %}
</li>
